name: Probe jdtls

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List milestones and checksum the newest
        run: |
          base=https://download.eclipse.org/jdtls/milestones
          curl -sSL -w 'HTTP %{http_code}\n' "$base/" -o index.html || true
          head -c 1500 index.html || true
          echo
          vers=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' index.html | sort -uV | tail -10 || true)
          echo "versions: $vers"
          for v in $(echo "$vers" | tail -3); do
            echo "--- $v"
            name=$(curl -sSL "$base/$v/latest.txt" || true)
            echo "latest.txt: $name"
            if [ -n "$name" ]; then
              curl -sSL "$base/$v/$name" -o "jdtls-$v.tar.gz" || true
              sha256sum "jdtls-$v.tar.gz" || true
              ls -l "jdtls-$v.tar.gz" || true
              tar tzf "jdtls-$v.tar.gz" | head -25 || true
            fi
          done
          exit 0
