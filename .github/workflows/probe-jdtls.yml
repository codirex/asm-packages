name: Probe jdtls

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Highest Java each milestone needs
        run: |
          set -u
          for v in 1.59.0 1.60.0 1.61.0; do
            echo "=== $v"
            name=$(curl -fsSL "https://download.eclipse.org/jdtls/milestones/$v/latest.txt" | tr -d '\r\n')
            echo "archive: $name"
            curl -fsSL -o "t-$v.tgz" "https://download.eclipse.org/jdtls/milestones/$v/$name"
            echo "sha256: $(sha256sum "t-$v.tgz" | cut -d' ' -f1)"
            mkdir "x-$v"
            tar xzf "t-$v.tgz" -C "x-$v"
            max=0
            for jar in "x-$v"/plugins/*.jar; do
              mf=$(unzip -p "$jar" META-INF/MANIFEST.MF 2> /dev/null | tr -d '\r' | awk '/^ /{sub(/^ /,""); printf "%s",$0; next} {printf "\n%s",$0}')
              need=$(echo "$mf" | grep -oE 'osgi\.ee=JavaSE\)\(version=[0-9.]+|Bundle-RequiredExecutionEnvironment: JavaSE-[0-9.]+' | grep -oE '[0-9.]+$' | sed 's/^1\.//' | sort -n | tail -n 1)
              [ -n "$need" ] || continue
              major=${need%%.*}
              if [ "$major" -gt 21 ]; then echo "  needs $need: $(basename "$jar")"; fi
              [ "$major" -gt "$max" ] && max=$major
            done
            echo "highest Java needed: $max"
          done
