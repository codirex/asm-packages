name: Probe jdtls

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Layout of the 1.63.0 archive
        run: |
          base=https://download.eclipse.org/jdtls/milestones/1.63.0
          f=jdt-language-server-1.63.0-202610191322.tar.gz
          curl -sSL "$base/$f" -o j.tgz
          echo "sha256: $(sha256sum j.tgz)"
          tar tzf j.tgz | grep -vE '^plugins/(.*\.jar)$' | head -40
          echo "--- launcher and config entries"
          tar tzf j.tgz | grep -E 'equinox.launcher_|config_' | head
          mkdir x && tar xzf j.tgz -C x
          ls x x/config_linux || true
          cat x/config_linux/config.ini | head -20 || true
          sed -n 1,60p x/bin/jdtls.py | head -80
          grep -n 'Xmx\|add-opens\|add-modules\|Declipse\|Dosgi\|Dlog' x/bin/jdtls.py || true
          exit 0
