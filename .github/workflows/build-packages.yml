name: Build packages

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture (or all)
        default: aarch64
        type: choice
        options: [aarch64, arm, x86_64, i686, all]
      list:
        description: Package list file
        default: packages/bootstrap.txt

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.p.outputs.archs }}
    steps:
      - id: p
        run: |
          if [ "${{ inputs.arch }}" = all ]; then
            echo 'archs=["aarch64","arm","x86_64","i686"]' >> "$GITHUB_OUTPUT"
          else
            echo 'archs=["${{ inputs.arch }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.archs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Prepare termux-packages with overlay
        run: bash scripts/prepare.sh

      # The image build downloads from Ubuntu mirrors, which are sometimes out of sync for a few
      # minutes (a 404 for a package that was just replaced). Trying again fixes that.
      - name: Build builder image
        working-directory: termux-packages/scripts
        run: |
          for attempt in 1 2 3; do
            if docker build -t asm-package-builder .; then
              exit 0
            fi
            echo "Image build failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1

      # A source download from a slow host (git.kernel.org, for example) sometimes times out. Trying
      # again fixes that, and the packages that were built stay in the output folder.
      - name: Build packages
        working-directory: termux-packages
        env:
          TERMUX_BUILDER_IMAGE_NAME: asm-package-builder
          CI: "true"
        run: |
          PKGS=$(grep -vE '^\s*(#|$)' "../${{ inputs.list }}" | tr '\n' ' ')
          echo "Building: $PKGS"
          for attempt in 1 2 3; do
            if ./scripts/run-docker.sh ./build-package.sh -a "${{ matrix.arch }}" $PKGS; then
              exit 0
            fi
            echo "Package build failed (attempt $attempt of 3)"
            sleep 60
          done
          exit 1

      - name: List output
        if: always()
        run: ls -la termux-packages/output/ || true

      # Some package versions have an epoch (for example 1:2026.11.05), so the file name has a colon,
      # which artifacts refuse. A tar archive keeps the names intact.
      - name: Archive packages
        if: always()
        run: |
          cd termux-packages/output && tar -cf "$GITHUB_WORKSPACE/debs-${{ matrix.arch }}.tar" ./*.deb || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debs-${{ matrix.arch }}
          path: debs-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
